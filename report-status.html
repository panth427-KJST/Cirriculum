:root{--ink:#1c2430;--muted:#5d6b7a;--line:#dde3ea;--bg:#f5f7fa;--card:#fff;--navy:#1f4e79;--err:#c62828;--errbg:#fdecea;--warn:#b26a00;--warnbg:#fff4e0;--info:#2d6a9f;--infobg:#e8f1fa;--ok:#2e7d32;--okbg:#e8f5e9;--none:#8a96a3}
*{box-sizing:border-box}
body{margin:0;font-family:Sarabun,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.5}
header{background:var(--navy);color:#fff;padding:20px 24px}
header h1{margin:0;font-size:24px}
header p{margin:4px 0 0;opacity:.85;font-size:14px}
nav.tabs{display:flex;gap:4px;padding:0 24px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;overflow-x:auto}
nav.tabs button{border:0;background:none;padding:12px 14px;font:inherit;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button.on{color:var(--navy);border-color:var(--navy)}
main{max-width:1180px;margin:0 auto;padding:20px 16px 60px}
section.tab{display:none}section.tab.on{display:block}
h2{font-size:20px;margin:26px 0 10px;color:var(--navy)}
h3{font-size:17px;margin:18px 0 8px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.kpi b{display:block;font-size:30px;line-height:1.1}
.kpi span{color:var(--muted);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:12px}
.bars .row{display:grid;grid-template-columns:210px 1fr 70px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.bar{display:flex;height:18px;border-radius:4px;overflow:hidden;background:#eef1f4}
.bar i{display:block;height:100%}
.c-sub{background:var(--ok)}.c-draft{background:#f0a83a}.c-none{background:#c9d1da}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap;margin-bottom:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:4px;vertical-align:-1px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:#eef2f6;font-weight:700;position:sticky;top:0}
td.num{text-align:center;white-space:nowrap}
.sev{display:inline-block;border-radius:4px;padding:0 6px;font-size:12.5px;font-weight:700;white-space:nowrap}
.sev.error{background:var(--errbg);color:var(--err)}.sev.warn{background:var(--warnbg);color:var(--warn)}.sev.info{background:var(--infobg);color:var(--info)}
.st{display:inline-block;border-radius:12px;padding:0 9px;font-size:13px;font-weight:700;white-space:nowrap}
.st.sub{background:var(--okbg);color:var(--ok)}.st.draft{background:var(--warnbg);color:var(--warn)}.st.none{background:#eceff2;color:var(--none)}
.steps{display:inline-flex;gap:3px}
.steps i{width:16px;height:16px;border-radius:3px;font-style:normal;font-size:11px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700}
.steps i.d{background:var(--ok)}.steps i.p{background:#f0a83a}.steps i.n{background:#d3d9e0;color:#7a8794}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:4px 12px;font:inherit;font-size:14px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
select,input[type=search]{font:inherit;font-size:14px;padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:#fff}
input[type=search]{min-width:200px}
tr.click{cursor:pointer}tr.click:hover td{background:#f3f7fb}
.cnt{font-weight:700}.cnt.e{color:var(--err)}.cnt.w{color:var(--warn)}
.muted{color:var(--muted)}
.rec{color:#24527a;font-size:14px}
details{border:1px solid var(--line);border-radius:8px;background:#fff;margin:8px 0}
details>summary{padding:10px 12px;cursor:pointer;font-weight:700;list-style:none;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
details>summary::-webkit-details-marker{display:none}
details>summary:before{content:"▸";color:var(--muted)}details[open]>summary:before{content:"▾"}
details .body{padding:0 12px 12px}
.clist a{color:var(--navy);text-decoration:none;border-bottom:1px dotted;cursor:pointer;margin-right:10px;white-space:nowrap;display:inline-block}
#drawer{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;z-index:20}
#drawer.on{display:block}
#panel{position:absolute;right:0;top:0;bottom:0;width:min(760px,100%);background:#fff;overflow:auto;padding:18px 20px 40px;box-shadow:-4px 0 18px rgba(0,0,0,.15)}
#panel h2{margin-top:0}
.close{float:right;border:0;background:#eef2f6;border-radius:6px;padding:4px 10px;font:inherit;cursor:pointer}
.meta{display:grid;grid-template-columns:140px 1fr;gap:2px 12px;font-size:14.5px;margin:8px 0 12px}
.meta div:nth-child(odd){color:var(--muted)}
.stepbox{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin:8px 0 14px}
.stepbox div{border-radius:6px;padding:6px;text-align:center;font-size:12.5px;line-height:1.3}
.stepbox .d{background:var(--okbg);color:var(--ok)}.stepbox .p{background:var(--warnbg);color:var(--warn)}.stepbox .n{background:#f0f2f5;color:var(--none)}
.iss{border-left:4px solid var(--line);padding:6px 10px;margin:6px 0;background:#fafbfc;border-radius:0 6px 6px 0}
.iss.error{border-color:var(--err)}.iss.warn{border-color:#f0a83a}.iss.info{border-color:#7fa8cf}
.iss .t{font-weight:700}.iss .dt{font-size:14px;color:#33404d;margin:2px 0}
.note{font-size:13.5px;color:var(--muted)}
.sysrec li{margin:6px 0}
@media (max-width:700px){.bars .row{grid-template-columns:120px 1fr 54px}.hide-sm{display:none}.stepbox{grid-template-columns:repeat(3,1fr)}}

"error", "type": "ตัวชี้วัด/ผลการเรียนรู้ไม่มีคะแนน (V04)", "rec": "เพิ่มแถวคะแนนของข้อนั้น"}, "S6X": {"step": 6, "sev": "error", "type": "แถวคะแนนอ้างข้อที่ไม่ใช่ของหน่วย/ข้อว่าง", "rec": "ลบหรือย้ายแถวคะแนนไปหน่วยที่ถูกต้อง"}, "W03": {"step": 6, "sev": "warn", "type": "(A) ตัวชี้วัดปลายทางไม่มีคะแนนสอบเลย (W03)", "rec": "ลงคะแนนกลางภาค/ปลายภาคให้ตัวชี้วัดปลายทาง"}, "W05": {"step": 6, "sev": "warn", "type": "สัดส่วนคะแนนหน่วยต่างจากสัดส่วนชั่วโมงมาก (W05)", "rec": "ทบทวนน้ำหนักคะแนนของหน่วยให้สอดคล้องกับเวลาเรียน"}, "Q01": {"step": 7, "sev": "warn", "type": "ยังไม่ระบุคุณลักษณะ/สมรรถนะ/เครื่องมือ", "rec": "เลือกคุณลักษณะอันพึงประสงค์ สมรรถนะสำคัญ และเครื่องมือประเมินทุกหน่วย"}}, "steps": {"1": "ขั้นที่ 1 ข้อมูลรายวิชา", "2": "ขั้นที่ 2 คำอธิบายรายวิชา", "3": "ขั้นที่ 3 ตัวชี้วัด/ผลการเรียนรู้", "4": "ขั้นที่ 4 หน่วยการเรียนรู้", "5": "ขั้นที่ 5 กำหนดการสอน", "6": "ขั้นที่ 6A คะแนน K/P", "7": "ขั้นที่ 6B ประเมินเชิงคุณภาพ", "0": "ความคืบหน้า"}, "summary": ["มอบหมายรายวิชาภาคเรียนที่ 2/2569 ทั้งหมด <b>164<\/b> รายวิชา (ชั้น×วิชา) · ส่งแล้ว <b>39<\/b> (24%) · ร่าง <b>86<\/b> · ยังไม่เริ่ม <b>39<\/b> (24%)", "กลุ่มสาระที่ยังไม่มีร่างเลย: <b>สุขศึกษาและพลศึกษา<\/b> · กลุ่มที่ยังไม่เริ่มมากที่สุด: สุขศึกษาและพลศึกษา 15/15, การงานอาชีพ 7/17, สังคมศึกษา ศาสนา และวัฒนธรรม 6/25, ภาษาต่างประเทศ 4/24", "วิชา ว32202 ม.5 (ครู T304) ดำเนินการครบทุกขั้นตอนและส่งแล้ว (แจ้งโดยหัวหน้ากลุ่มบริหารงานวิชาการ 2 พ.ย. 2569)", "ร่าง <b>14<\/b> ฉบับยืนยันครบทั้ง 6 ขั้นแล้วแต่ยังไม่กดส่ง ในจำนวนนี้ 14 ฉบับไม่มีข้อผิดพลาด ✗ ส่งได้ทันที", "ฉบับร่าง/ส่งแล้ว <b>38<\/b> ฉบับมีข้อผิดพลาด ✗ อย่างน้อย 1 รายการ ส่วนใหญ่อยู่ในขั้นที่กำลังทำ (ยังไม่ยืนยัน) ปัญหาที่พบบ่อย: หน่วยไม่มีสาระสำคัญ/ไม่ได้เลือกตัวชี้วัด (9 วิชา), กำหนดการสอนยังกรอกไม่ครบ (8 วิชา), ไม่ได้เลือกหน่วยในแถวสอบ (8 วิชา), เลือกตัวชี้วัดข้ามหน่วย (3 วิชา 25 สัปดาห์)", "ตารางคะแนน: คะแนนรวมไม่เท่ากับ 100 9 วิชา · อัตราส่วนไม่ตรงที่เลือก 3 วิชา · K+P ไม่เท่าผลรวมช่องสอบ 7 วิชา · ยังไม่ระบุการประเมินเชิงคุณภาพ 16 วิชา", "ฉบับที่ส่งแล้ว 39 ฉบับ <b>มีข้อผิดพลาด ✗ 1 ฉบับ<\/b> (ค31102 ม.4: V10 หน่วยที่ 1 ค 3.2 ม.4/1: กลางภาค 10 ปลายภาค 0) ส่งได้แม้ผิดกฎ ผู้ตรวจต้องตีกลับ · มีคำเตือน ⚠ 14 ฉบับ (เช่น คะแนนกลางภาคอยู่ในแถวของหน่วยหลังกลางภาค, สัดส่วนคะแนนต่างจากเวลาเรียน) ผู้ตรวจควรดูประกอบการรับรอง", "วิชาพื้นฐานที่ครูเปลี่ยนประเภทระหว่างทาง/ปลายทางต่างจากข้อมูลกลาง <b>5<\/b> วิชา (ท22102 ม.2, ว22104 ม.2, ว23102 ม.3, ส22102 ม.2, อ31102 ม.4) — ผู้ตรวจต้องตัดสินก่อนรับรอง", "ครูแก้คำอธิบายรายวิชาต่างจากหลักสูตร 19 วิชา และแก้ข้อความตัวชี้วัด/ผลการเรียนรู้ 26 วิชา ควรตรวจว่าตรงกับหลักสูตรหรือควรปรับข้อมูลกลาง (แบบที่ทำกับ ว30251)"], "sys": "<h2>ข้อเสนอแนะสำหรับกลุ่มบริหารงานวิชาการและผู้ดูแลระบบ<\/h2><div class=\"card\"><ol class=\"sysrec\"><li><b>ติดตามรายวิชาที่ยังไม่เริ่ม<\/b><br>39 รายวิชายังไม่มีร่าง โดยเฉพาะ สุขศึกษาและพลศึกษา (15), การงานอาชีพ (7), สังคมศึกษา ศาสนา และวัฒนธรรม (6) · แจ้งหัวหน้ากลุ่มสาระพร้อมรายชื่อในแท็บรายวิชา (กรองสถานะ \"ยังไม่เริ่ม\")<\/li><li><b>เร่งกดส่งฉบับที่ครบแล้ว<\/b><br>14 ฉบับยืนยันครบ 6 ขั้นแล้ว (14 ฉบับไม่มี ✗): ส21102 ม.1, ส22104 ม.2, ว20219 ม.1, ค21202 ม.1, อ31202 ม.4, จ20202 ม.1, ว23102 ม.3, I30202 ม.4, อ23202 ม.3, จ20203 ม.2, จ20204 ม.3, จ30201 ม.4, จ30203 ม.5, จ30205 ม.6<\/li><li><b>ตั้งค่าสัปดาห์สอบใน Settings<\/b><br>ค่า midterm_week / final_week ในชีต Settings ยังว่าง (ร่างทุกฉบับใช้สัปดาห์ 10 และ 20) ควรใส่ตามปฏิทินภาคเรียนเพื่อให้กฎ V02/V09 ตรวจได้ถูกต้อง<\/li><li><b>ระบบ: ล้างตัวชี้วัดที่ไม่ใช่ของหน่วยอัตโนมัติ (V05)<\/b><br>พบเลือกตัวชี้วัดข้ามหน่วย 25 สัปดาห์ใน 3 วิชา (ง20203 ม.2, ง33101 ม.6, ส30202 ม.4) เกิดเมื่อครูแก้ตัวชี้วัดของหน่วยในขั้นที่ 4 หลังกรอกขั้นที่ 5 แล้ว ควรให้ระบบตัดตัวชี้วัดที่ไม่ใช่ของหน่วยออกเมื่อแก้หน่วย หรือเตือนตอนยืนยันขั้นที่ 5<\/li><li><b>ระบบ: เลือกหน่วยในแถวสอบให้อัตโนมัติ<\/b><br>8 วิชายังไม่เลือกหน่วยที่นับชั่วโมงสอบ (ค31202 ม.4, ง22102 ม.2, ท30201 ม.4, ว30201 ม.4, ว30221 ม.4, ว30255 ม.4, ว31202 ม.4, ส30206 ม.6) ควรตั้งค่าเริ่มต้นเป็นหน่วยของสัปดาห์ก่อนหน้า<\/li><li><b>ระบบ: ปุ่มลบตัวชี้วัด/ผลการเรียนรู้ (ผ่านการอนุมัติ)<\/b><br>ครูลบข้อความแล้วเหลือเลขข้อว่าง (ล้างไปแล้ว 4 วิชาเมื่อ 30 ต.ค. และ อ30201 เมื่อ 2 พ.ย.) ยังเหลือ ท22102 ม.2, ส21104 ม.1 ซึ่งเป็นวิชาพื้นฐาน ต้องตัดสินที่ข้อมูลกลาง · ควรมีปุ่ม \"ขอตัดข้อนี้\" ให้หัวหน้ากลุ่มบริหารงานวิชาการอนุมัติ<\/li><li><b>ระบบ: ล็อกประเภทระหว่างทาง/ปลายทางในวิชาพื้นฐาน<\/b><br>ครูเปลี่ยนประเภทตัวชี้วัดต่างจากข้อมูลกลาง (สพฐ.) 5 วิชา (ท22102 ม.2, ว22104 ม.2, ว23102 ม.3, ส22102 ม.2, อ31102 ม.4) ส่วนใหญ่เปลี่ยนระหว่างทาง→ปลายทางเพื่อให้ลงคะแนนสอบได้ ทำให้กฎ V10 ไม่มีผล เพราะระบบตรวจตามประเภทที่ครูตั้ง · ควรล็อกประเภทในแบบ A หรือให้ระบบเตือนเมื่อต่างจากข้อมูลกลาง และกำหนดนโยบายกรณีวิชาที่ไม่มีตัวชี้วัดปลายทางก่อนกลางภาค (ไม่มีคะแนนกลางภาค)<\/li><li><b>ระบบ: ไม่ให้วิชาพื้นฐานเพิ่มตัวชี้วัดเอง<\/b><br>แบบ A มีการเพิ่มตัวชี้วัดที่ไม่มีรหัส/ประเภท (ว22104 ม.2) ทำให้ใช้กฎระหว่างทาง/ปลายทางไม่ได้ ควรปิดปุ่มเพิ่มรายการในแบบ A<\/li><li><b>นโยบาย: คะแนนกลางภาคในหน่วยที่คร่อมกลางภาค (V09)<\/b><br>ระบบตรวจ V09 รายตัวชี้วัด จึงยอมให้แถวของหน่วยที่สอนหลังกลางภาคมีคะแนนกลางภาคได้ ถ้าตัวชี้วัดเดียวกันสอนก่อนกลางภาคในหน่วยอื่น พบ 3 วิชา (ท21102 ม.1, ว23104 ม.3, ศ20220 ม.1) ควรกำหนดว่าจะตรวจรายแถวหน่วยหรือไม่ เพราะมีผลต่อแนวทางการวัดตามองค์ประกอบ (ขั้นที่ 7)<\/li><li><b>ระบบ: บังคับกรอกการประเมินเชิงคุณภาพ<\/b><br>16 วิชายังไม่ระบุคุณลักษณะ/สมรรถนะ/เครื่องมือ ในขณะที่มีคะแนนแล้ว ควรเพิ่มเป็นคำเตือนก่อนยืนยันขั้นที่ 6<\/li><li><b>ตรวจการแก้เนื้อหาหลักสูตร<\/b><br>คำอธิบายถูกแก้ 19 วิชา ตัวชี้วัด/ผลการเรียนรู้ถูกแก้ 26 วิชา ผู้ตรวจลำดับแรกควรเทียบกับหลักสูตร หากเป็นการปรับถาวร (เช่น ว30251) ให้ปรับข้อมูลกลางและบันทึกในเอกสารคำแนะนำการปรับไฟล์หลักสูตร<\/li><\/ol><\/div><h2>ข้อเสนอแนะสำหรับครูผู้สอน (ลำดับการทำ)<\/h2><div class=\"card\"><ol class=\"sysrec\"><li>ทำทีละขั้นและกด \"ยืนยัน\" เมื่อเสร็จ ระบบนับว่าเสร็จเฉพาะขั้นที่ยืนยันแล้ว<\/li><li>ขั้นที่ 4: ทุกหน่วยต้องมีชื่อ สาระสำคัญ และเลือกตัวชี้วัดอย่างน้อย 1 ข้อ ตัวชี้วัดทุกข้อต้องอยู่ในหน่วยใดหน่วยหนึ่ง<\/li><li>ถ้าแก้ตัวชี้วัดของหน่วยหลังทำขั้นที่ 5 แล้ว ให้ย้อนตรวจกำหนดการสอนทุกสัปดาห์ของหน่วยนั้น<\/li><li>ขั้นที่ 5: ทุกสัปดาห์สอนต้องเลือกหน่วย หัวข้อ และตัวชี้วัด แถวสอบกลางภาค/ปลายภาคต้องเลือกหน่วยที่นับชั่วโมง ชั่วโมงรวมต้องเท่าชั่วโมงรายวิชา<\/li><li>ขั้นที่ 6: แต่ละแถว K+P = ระหว่างเรียน+กลางภาค+ปลายภาค รวม 100 และ (ระหว่างเรียน+กลางภาค):ปลายภาค ตรงอัตราส่วนที่เลือก<\/li><li>วิชาพื้นฐาน (แบบ A): คะแนนกลางภาค/ปลายภาคลงได้เฉพาะตัวชี้วัดปลายทาง และกลางภาคเฉพาะที่สอนก่อนสัปดาห์สอบกลางภาค<\/li><li>กรอกการประเมินเชิงคุณภาพ (คุณลักษณะ สมรรถนะ เครื่องมือ) ให้ครบทุกหน่วย แล้วกด \"ตรวจสอบและส่ง\"<\/li><\/ol><\/div>", "asof": "2 พ.ย. 2569 เวลา 16:45 น."};

const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const stc=s=>s==='ส่งแล้ว'?'sub':s==='ร่าง'?'draft':'none';
const cnt=(c,sev)=>c.issues.filter(x=>x.sev===sev&&x.step>0).length;
const idx=(c)=>C.indexOf(c);
document.getElementById('asof').textContent=DATA.asof;
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('section.tab').forEach(s=>s.classList.toggle('on',s.id==='t-'+b.dataset.t));window.scrollTo(0,0)});
function stepsHTML(c){return '<span class="steps">'+c.done.map((d,i)=>`<i class="${d?'d':(c.started&&c.first_open===i+1?'p':'n')}" title="ขั้นที่ ${i+1} ${STN[i]}">${i+1}</i>`).join('')+'</span>'}
function bar(rows){return '<div class="legend"><span><i class="c-sub"></i>ส่งแล้ว</span><span><i class="c-draft"></i>ร่าง (ยังไม่ส่ง)</span><span><i class="c-none"></i>ยังไม่เริ่ม</span></div><div class="bars">'+rows.map(([k,v])=>{const t=v.s+v.d+v.n;return `<div class="row"><div>${esc(k)}</div><div class="bar"><i class="c-sub" style="width:${v.s/t*100}%"></i><i class="c-draft" style="width:${v.d/t*100}%"></i><i class="c-none" style="width:${v.n/t*100}%"></i></div><div class="muted">${v.s}/${t} ส่ง</div></div>`}).join('')+'</div>'}
function agg(key){const m={};C.forEach(c=>{const k=c[key];m[k]=m[k]||{s:0,d:0,n:0};m[k][c.status==='ส่งแล้ว'?'s':c.status==='ร่าง'?'d':'n']++});return Object.entries(m)}
// ---------- overview
(function(){
 const n=C.length,sub=C.filter(c=>c.status==='ส่งแล้ว').length,dr=C.filter(c=>c.status==='ร่าง').length,ns=C.filter(c=>!c.started).length;
 const withErr=C.filter(c=>c.started&&cnt(c,'error')>0).length, all6=C.filter(c=>c.status==='ร่าง'&&c.ndone===6).length;
 let h=`<div class="kpis"><div class="kpi"><b>${n}</b><span>รายวิชาที่มอบหมาย (ชั้น×วิชา)</span></div><div class="kpi"><b style="color:var(--ok)">${sub}</b><span>ส่งแล้ว (${(sub/n*100).toFixed(0)}%)</span></div><div class="kpi"><b style="color:var(--warn)">${dr}</b><span>ร่าง ยังไม่ส่ง</span></div><div class="kpi"><b style="color:var(--none)">${ns}</b><span>ยังไม่เริ่มจัดทำ</span></div><div class="kpi"><b style="color:var(--err)">${withErr}</b><span>ฉบับที่มีข้อผิดพลาด ✗</span></div><div class="kpi"><b>${all6}</b><span>ยืนยันครบ 6 ขั้นแต่ยังไม่กดส่ง</span></div></div>`;
 h+=`<h2>สรุปสำคัญ</h2><div class="card"><ul>${DATA.summary.map(s=>'<li>'+s+'</li>').join('')}</ul></div>`;
 h+=`<h2>ความคืบหน้าแยกกลุ่มสาระ</h2><div class="card">${bar(agg('group').sort((a,b)=>(b[1].s+b[1].d+b[1].n)-(a[1].s+a[1].d+a[1].n)))}</div>`;
 h+=`<h2>ความคืบหน้าแยกชั้น</h2><div class="card">${bar(agg('grade').sort())}</div>`;
 const fo={};C.filter(c=>c.status==='ร่าง').forEach(c=>{const k=c.first_open?('ค้างที่ขั้นที่ '+c.first_open+' '+STN[c.first_open-1]):'ยืนยันครบ 6 ขั้น รอกดส่ง';fo[k]=(fo[k]||0)+1});
 const mx=Math.max(...Object.values(fo));
 h+=`<h2>ร่างที่ยังไม่ส่ง ค้างอยู่ที่ขั้นไหน (${dr} ฉบับ)</h2><div class="card bars">`+Object.entries(fo).sort().map(([k,v])=>`<div class="row"><div>${k}</div><div class="bar"><i class="c-draft" style="width:${v/mx*100}%"></i></div><div class="muted">${v} ฉบับ</div></div>`).join('')+'</div>';
 document.getElementById('t-ov').innerHTML=h;
})();
// ---------- issues by step
(function(){
 let h='<p class="note">✗ = ระบบไม่ให้ส่ง/ต้องแก้ · ⚠ = ส่งได้แต่ผู้ตรวจควรดู · ℹ = ข้อสังเกต · คลิกรหัสวิชาเพื่อเปิดรายละเอียด</p>';
 const steps=[0,1,2,3,4,5,6,7];
 steps.forEach(st=>{
  const codes=Object.keys(R).filter(k=>R[k].step===st);
  const blocks=codes.map(k=>{const cs=C.filter(c=>c.issues.some(x=>x.code===k));return [k,cs]}).filter(b=>b[1].length);
  if(!blocks.length)return;
  h+=`<h2>${esc(S[st])}</h2>`;
  blocks.sort((a,b)=>({error:0,warn:1,info:2}[R[a[0]].sev]-{error:0,warn:1,info:2}[R[b[0]].sev])||b[1].length-a[1].length).forEach(([k,cs])=>{
   h+=`<details><summary><span class="sev ${R[k].sev}">${SEVL[R[k].sev]}</span>${esc(R[k].type)} <span class="muted">· ${cs.length} รายวิชา</span></summary><div class="body"><p class="rec"><b>แนวทางแก้:</b> ${esc(R[k].rec)}</p><div class="clist">${cs.map(c=>`<a data-i="${idx(c)}">${esc(c.code)} ${esc(c.grade)}</a>`).join('')}</div></div></details>`});
 });
 document.getElementById('t-iss').innerHTML=h;
})();
// ---------- system recs
document.getElementById('t-sys').innerHTML=SYS;
// ---------- list
const grades=['ทั้งหมด',...[...new Set(C.map(c=>c.grade))].sort()];let G='ทั้งหมด';
document.getElementById('fgrade').innerHTML=grades.map(g=>`<button class="chip ${g===G?'on':''}" data-g="${g}">${g}</button>`).join('');
document.getElementById('fgrade').onclick=e=>{if(!e.target.dataset.g)return;G=e.target.dataset.g;document.querySelectorAll('#fgrade .chip').forEach(b=>b.classList.toggle('on',b.dataset.g===G));render()};
const groups=[...new Set(C.map(c=>c.group))].sort();
document.getElementById('fgroup').innerHTML='<option value="">ทุกกลุ่มสาระ</option>'+groups.map(g=>`<option>${esc(g)}</option>`).join('');
['fgroup','fstatus','fsev'].forEach(id=>document.getElementById(id).onchange=render);document.getElementById('fq').oninput=render;
function render(){
 const g=document.getElementById('fgroup').value,s=document.getElementById('fstatus').value,v=document.getElementById('fsev').value,q=document.getElementById('fq').value.trim().toLowerCase();
 let L=C.filter(c=>(G==='ทั้งหมด'||c.grade===G)&&(!g||c.group===g)&&(!s||c.status===s)&&(!q||(c.code+' '+c.name+' '+c.teachers).toLowerCase().includes(q)));
 if(v==='error')L=L.filter(c=>cnt(c,'error'));if(v==='warn')L=L.filter(c=>cnt(c,'warn'));if(v==='clean')L=L.filter(c=>c.started&&!cnt(c,'error')&&!cnt(c,'warn'));
 L.sort((a,b)=>a.grade.localeCompare(b.grade)||a.code.localeCompare(b.code,'th'));
 document.getElementById('fcount').textContent=L.length+' รายวิชา';
 document.querySelector('#ctable tbody').innerHTML=L.map(c=>{const e=cnt(c,'error'),w=cnt(c,'warn');return `<tr class="click" data-i="${idx(c)}"><td><b>${esc(c.code)}</b></td><td>${esc(c.name)||'<span class="muted">—</span>'}</td><td>${esc(c.grade)}</td><td class="hide-sm muted">${esc(c.teachers.split(',').slice(0,3).join(', '))}${c.teachers.split(',').length>3?' +'+(c.teachers.split(',').length-3):''}</td><td><span class="st ${stc(c.status)}">${esc(c.status)}</span></td><td>${stepsHTML(c)}</td><td class="num"><span class="cnt ${e?'e':''}">${e||'–'}</span></td><td class="num"><span class="cnt ${w?'w':''}">${w||'–'}</span></td><td class="hide-sm muted">${esc(c.updated)}</td></tr>`}).join('');
}
render();
document.body.addEventListener('click',e=>{const t=e.target.closest('[data-i]');if(t)openC(+t.dataset.i)});
document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer'||e.target.classList.contains('close'))document.getElementById('drawer').classList.remove('on')};
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('drawer').classList.remove('on')});
function openC(i){
 const c=C[i];let h=`<button class="close">ปิด ✕</button><h2>${esc(c.code)} ${esc(c.name)}</h2>`;
 h+=`<div class="meta"><div>ชั้น</div><div>${esc(c.grade)} · หลักสูตร ${esc(c.cur)} · แบบ ${esc(c.tpl)} (${c.tpl==='A'?'พื้นฐาน ใช้ตัวชี้วัด':'เพิ่มเติม ใช้ผลการเรียนรู้'})</div><div>กลุ่มสาระ</div><div>${esc(c.group)}${c.track?' · '+esc(c.track):''}</div><div>ครูผู้สอน</div><div>${esc(c.teachers.split(',').join(', '))}</div><div>สถานะ</div><div><span class="st ${stc(c.status)}">${esc(c.status)}</span>${c.note?` · ${esc(c.note)}`:c.started?` · ยืนยันแล้ว ${c.ndone}/6 ขั้น · ฉบับที่ ${esc(c.version)} · แก้ไขล่าสุด ${esc(c.updated)} โดย ${esc(c.by)}`:''}</div>${c.started&&!c.note?`<div>ขนาด</div><div>${c.nitems} ${c.tpl==='A'?'ตัวชี้วัด':'ผลการเรียนรู้'} · ${c.nunits} หน่วย</div>`:''}</div>`;
 h+='<div class="stepbox">'+c.done.map((d,k)=>`<div class="${d?'d':(c.started&&c.first_open===k+1?'p':'n')}"><b>ขั้น ${k+1}</b><br>${STN[k]}<br>${d?'✓ ยืนยันแล้ว':(c.started&&c.first_open===k+1?'กำลังทำ':'ยังไม่ยืนยัน')}</div>`).join('')+'</div>';
 const order={error:0,warn:1,info:2};
 const by={};c.issues.forEach(x=>{(by[x.step]=by[x.step]||[]).push(x)});
 const keys=Object.keys(by).map(Number).sort((a,b)=>(a===0?99:a)-(b===0?99:b));
 if(!c.issues.filter(x=>x.step>0).length&&c.started)h+='<p style="color:var(--ok);font-weight:700">✓ ไม่พบข้อผิดพลาดหรือคำเตือนในข้อมูลที่กรอกแล้ว</p>';
 keys.forEach(st=>{h+=`<h3>${esc(S[st])}</h3>`;const g={};by[st].forEach(x=>{(g[x.code]=g[x.code]||[]).push(x)});
  Object.values(g).sort((a,b)=>order[a[0].sev]-order[b[0].sev]).forEach(xs=>{const x=xs[0];const ds=xs.map(y=>y.detail).filter(Boolean);
   h+=`<div class="iss ${x.sev}"><div class="t"><span class="sev ${x.sev}">${SEVL[x.sev]}</span> ${esc(x.type)}${xs.length>1?' <span class="muted">('+xs.length+' จุด)</span>':''}${x.step>0&&!x.confirmed&&c.started?' <span class="note">(ขั้นนี้ยังไม่ยืนยัน)</span>':''}</div>${ds.length>1?'<ul class="dt" style="margin:2px 0;padding-left:18px">'+ds.map(d=>'<li>'+esc(d)+'</li>').join('')+'</ul>':ds.length?`<div class="dt">${esc(ds[0])}</div>`:''}<div class="rec">→ ${esc(x.rec)}</div></div>`})});
 if(c.started)h+=`<p class="note">ข้อที่อยู่ใน "ขั้นที่ยังไม่ยืนยัน" อาจเป็นงานที่ครูกำลังทำอยู่ ให้ใช้เป็นรายการตรวจก่อนกดยืนยัน</p>`;
 document.getElementById('panel').innerHTML=h;document.getElementById('drawer').classList.add('on');document.getElementById('panel').scrollTop=0;
}
</script></body></html>
